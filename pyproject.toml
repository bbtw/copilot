[project]
name = "lang-graph-state"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=1.3",
    "cvxpy>=1.5",
    "numpy>=1.26",
    "openai>=2.33.0",
    "langsmith>=0.1",
    "dotenv>=0.9.9",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "httpx>=0.28.1",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["lang_graph_state*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8.0"]
