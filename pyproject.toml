[project]
name = "copilot"
version = "0.1.0"
description = "Chat-driven retirement planning optimizer: Gurobi LP core, LLM chat via company gateway"
requires-python = ">=3.12"
dependencies = [
    "gurobipy>=12.0",
    "openai>=1.60",
    "langsmith>=0.3",
    "pydantic-settings>=2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
copilot = "copilot.web:main"
copilot-evals = "copilot.evals.run:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot"]
