[project]
name = "lang-graph-state"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=1.3",
    "openai>=2.33.0",
    "langsmith>=0.1",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["lang_graph_state*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
