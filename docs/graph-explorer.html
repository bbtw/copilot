<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retirement Plan Optimizer — Graph Explorer</title>
<style>
:root {
  --bg: #0C0E14;
  --surface: #141720;
  --surface2: #1C2030;
  --border: #252B40;
  --text: #E2E8F0;
  --muted: #64748B;
  --blue: #3B82F6;
  --indigo: #6366F1;
  --violet: #8B5CF6;
  --purple: #A855F7;
  --emerald: #10B981;
  --slate: #475569;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  background: var(--surface);
}

.logo { display: flex; align-items: center; gap: 10px; }
.logo h1 { font-size: 14px; font-weight: 600; }
.logo p { font-size: 11px; color: var(--muted); margin-top: 1px; }

.controls { display: flex; gap: 8px; align-items: center; }

button {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.15s;
  font-family: inherit;
}
button:hover { border-color: var(--blue); color: var(--blue); }
button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
button.primary:hover { background: #2563EB; border-color: #2563EB; color: #fff; }
button:disabled { opacity: 0.4; cursor: not-allowed; }

main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Graph Panel ─────────────────────────────────── */
.graph-panel {
  width: 580px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  overflow: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.graph-panel svg { max-width: 100%; }

/* SVG interactive styles */
.node-group { cursor: pointer; }
.node-bg {
  transition: filter 0.18s;
  rx: 8; ry: 8;
}
.node-group:hover .node-bg { filter: brightness(1.25); }
.node-group.selected .node-bg { filter: brightness(1.35) drop-shadow(0 0 10px rgba(255,255,255,0.15)); }
.node-group.lit .node-bg { animation: pulse 0.5s ease-out; }

@keyframes pulse {
  0%  { filter: brightness(2.2); }
  100%{ filter: brightness(1); }
}

.node-label {
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  font-size: 11px;
  font-weight: 500;
  fill: #E2E8F0;
  pointer-events: none;
  dominant-baseline: middle;
  text-anchor: middle;
}
.node-sublabel {
  font-size: 9px;
  fill: rgba(255,255,255,0.45);
  pointer-events: none;
  dominant-baseline: middle;
  text-anchor: middle;
  font-family: -apple-system, sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
}

.edge { fill: none; stroke-width: 1.8; stroke: #2A3050; }
.edge.fanout { stroke: #2D2555; }
.edge.fanin  { stroke: #2D2555; }
.edge.lit    { stroke: var(--blue); stroke-width: 2.2; }
.edge.litpar { stroke: var(--violet); stroke-width: 2.2; }

.parallel-zone { fill: rgba(139,92,246,0.04); stroke: rgba(139,92,246,0.18); stroke-width: 1; stroke-dasharray: 6 4; rx: 14; }
.parallel-label { font-size: 9.5px; fill: rgba(139,92,246,0.5); text-anchor: middle; letter-spacing: 0.06em; font-family: -apple-system, sans-serif; font-weight: 600; text-transform: uppercase; }

/* ── Legend ──────────────────────────────────────── */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 0 4px;
  width: 100%;
}
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); }
.legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

/* ── Details Panel ───────────────────────────────── */
.details-panel {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
}

.card-title {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin-bottom: 12px;
}

.empty-hint {
  color: var(--muted);
  font-size: 12px;
  padding: 20px 0;
  text-align: center;
  line-height: 1.6;
}

/* Node detail content */
.nd-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
.nd-name { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12.5px; font-weight: 600; color: var(--text); }
.nd-file { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10px; color: var(--muted); margin-bottom: 10px; }
.nd-badge {
  font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 4px;
  text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; flex-shrink: 0; margin-left: 8px;
}
.badge-data   { background: rgba(59,130,246,0.15);  color: #93C5FD; }
.badge-llm    { background: rgba(99,102,241,0.15);  color: #A5B4FC; }
.badge-agent  { background: rgba(139,92,246,0.15);  color: #C4B5FD; }
.badge-synth  { background: rgba(168,85,247,0.15);  color: #D8B4FE; }
.badge-output { background: rgba(71,85,105,0.15);   color: #94A3B8; }

.nd-desc { font-size: 12.5px; line-height: 1.65; color: #CBD5E1; margin-bottom: 12px; }

.io-section { margin-bottom: 10px; }
.io-label { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 5px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--muted);
}
.tag.write { border-color: rgba(59,130,246,0.4); color: #93C5FD; background: rgba(59,130,246,0.08); }
.tag.write.violet { border-color: rgba(139,92,246,0.4); color: #C4B5FD; background: rgba(139,92,246,0.08); }

.tools-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.tool-row {
  display: flex; align-items: flex-start; gap: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 10px;
}
.tool-icon { font-size: 13px; flex-shrink: 0; line-height: 1; margin-top: 1px; }
.tool-name { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10.5px; color: #C4B5FD; font-weight: 500; }
.tool-desc { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.4; }

.nd-lgtype {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--muted); margin-bottom: 10px;
}
.nd-lgtype span { color: var(--text); font-weight: 600; text-transform: none; letter-spacing: 0; }

pre.wiring {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 10.5px;
  line-height: 1.7;
  color: #94A3B8;
  background: #0A0C12;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  margin: 0;
  overflow-x: auto;
  white-space: pre;
}
pre.wiring .kw  { color: #818CF8; }
pre.wiring .fn  { color: #38BDF8; }
pre.wiring .str { color: #86EFAC; }
pre.wiring .cm  { color: #475569; font-style: italic; }

/* State inspector */
.state-row {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 8px; border-radius: 5px; transition: background 0.2s;
}
.state-row.live { background: rgba(59,130,246,0.07); }
.state-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); flex-shrink: 0; transition: background 0.3s, box-shadow 0.3s; }
.state-dot.live { background: var(--blue); box-shadow: 0 0 5px var(--blue); }
.state-fname { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10.5px; color: var(--muted); transition: color 0.2s; }
.state-fname.live { color: #93C5FD; }
.state-src { font-size: 9.5px; color: var(--muted); margin-left: auto; opacity: 0.55; white-space: nowrap; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div>
      <h1>Retirement Plan Optimizer</h1>
      <p>LangGraph Pipeline — Interactive Graph Explorer</p>
    </div>
  </div>
  <div class="controls">
    <button id="btnAnimate" class="primary">▶ Animate Flow</button>
    <button id="btnReset">Reset</button>
  </div>
</header>

<main>
  <div class="graph-panel">
    <svg id="graph" viewBox="0 0 540 810" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="legend">
      <div class="legend-item"><div class="legend-swatch" style="background:#1E3A5F;border:1.5px solid #3B82F6"></div>Data Gathering</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#1E1B4B;border:1.5px solid #6366F1"></div>LLM Completion</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#2D1B4E;border:1.5px solid #8B5CF6"></div>Probe + LLM</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#2A1A4E;border:1.5px solid #A855F7"></div>Synthesis</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#1C2333;border:1.5px solid #475569"></div>Output Assembly</div>
    </div>
  </div>

  <div class="details-panel">
    <div class="card" id="detailCard">
      <div class="card-title">Node Details</div>
      <div class="empty-hint">Click any node in the graph<br>to see what it does, what it reads,<br>and what it writes to state.</div>
    </div>

    <div class="card" id="stateCard">
      <div class="card-title">RetirementPlanState — Live Fields</div>
      <div id="stateInspector"></div>
    </div>
  </div>
</main>

<script>
// ── Node & Edge data ─────────────────────────────────────────────

const W = 170, H = 46, R = 8;   // node rect dimensions
const cx = 270;                   // center x for main spine

const NODES = [
  { id: 'start',         label: '__start__',                  x: cx,  y: 28,  type: 'terminal' },
  { id: 'load_profile',  label: 'load_customer_profile',      x: cx,  y: 110, type: 'data'     },
  { id: 'lp_optimizer',  label: 'run_lp_optimizer',           x: cx,  y: 205, type: 'data'     },
  { id: 'monte_carlo',   label: 'run_monte_carlo',            x: cx,  y: 300, type: 'data'     },
  { id: 'std_analysis',  label: 'run_standard_analysis',      x: 90,  y: 430, type: 'llm'      },
  { id: 'accum_agent',   label: 'run_accumulation_agent',     x: cx,  y: 430, type: 'agent'    },
  { id: 'with_agent',    label: 'run_withdrawal_agent',       x: 450, y: 430, type: 'agent'    },
  { id: 'synthesize',    label: 'synthesize_explanation',     x: cx,  y: 558, type: 'synth'    },
  { id: 'format_output', label: 'format_output',              x: cx,  y: 648, type: 'output'   },
  { id: 'end',           label: '__end__',                    x: cx,  y: 730, type: 'terminal' },
];

const EDGES = [
  { from: 'start',        to: 'load_profile',  class: '' },
  { from: 'load_profile', to: 'lp_optimizer',  class: '' },
  { from: 'lp_optimizer', to: 'monte_carlo',   class: '' },
  { from: 'monte_carlo',  to: 'std_analysis',  class: 'fanout' },
  { from: 'monte_carlo',  to: 'accum_agent',   class: 'fanout' },
  { from: 'monte_carlo',  to: 'with_agent',    class: 'fanout' },
  { from: 'std_analysis', to: 'synthesize',    class: 'fanin'  },
  { from: 'accum_agent',  to: 'synthesize',    class: 'fanin'  },
  { from: 'with_agent',   to: 'synthesize',    class: 'fanin'  },
  { from: 'synthesize',   to: 'format_output', class: '' },
  { from: 'format_output',to: 'end',           class: '' },
];

// ── Node visual config ────────────────────────────────────────────

const NODE_STYLE = {
  terminal: { fill: '#111827', stroke: '#374151', label2: null },
  data:     { fill: '#1E3A5F', stroke: '#3B82F6', label2: 'Data Gathering' },
  llm:      { fill: '#1E1B4B', stroke: '#6366F1', label2: 'LLM Completion' },
  agent:    { fill: '#2D1B4E', stroke: '#8B5CF6', label2: 'Probe + LLM' },
  synth:    { fill: '#2A1A4E', stroke: '#A855F7', label2: 'Synthesis LLM' },
  output:   { fill: '#1C2333', stroke: '#475569', label2: 'Output Assembly' },
};

// ── Node detail metadata ──────────────────────────────────────────

const DETAILS = {
  load_profile: {
    name: 'load_customer_profile',
    file: 'src/lang_graph_state/nodes/load_profile.py',
    badge: 'Plain Function', badgeClass: 'badge-output',
    lgType: 'Plain function node — no LLM, no tools',
    desc: 'The simplest LangGraph node type: a plain Python callable that receives the full state and returns a partial dict. LangGraph merges the returned dict into the shared TypedDict before advancing the edge. Stand-in for a real customer data API; the node signature (state in → dict out) is identical in production.',
    wiring: '<span class="cm"># main.py — node registration</span>\ngraph.<span class="fn">add_node</span>(<span class="str">"load_customer_profile"</span>, load_customer_profile)\ngraph.<span class="fn">add_edge</span>(START, <span class="str">"load_customer_profile"</span>)\ngraph.<span class="fn">add_edge</span>(<span class="str">"load_customer_profile"</span>, <span class="str">"run_lp_optimizer"</span>)',
    reads: ['(none — entry node)'],
    writes: ['customer_profile'],
    stateAfter: ['customer_profile'],
  },
  lp_optimizer: {
    name: 'run_lp_optimizer',
    file: 'src/lang_graph_state/nodes/lp_optimizer.py',
    badge: 'Stand-in Tool', badgeClass: 'badge-data',
    lgType: 'Plain function node — stand-in for production solver',
    desc: 'Runs a cvxpy LP solver and writes three fields to state. As a LangGraph node it is structurally identical to any other function node — just a callable. The LP internals are replaceable without touching the graph; only the state keys it writes to matter to downstream nodes.',
    wiring: '<span class="cm"># main.py — sequential spine</span>\ngraph.<span class="fn">add_node</span>(<span class="str">"run_lp_optimizer"</span>, run_lp_optimizer)\ngraph.<span class="fn">add_edge</span>(<span class="str">"load_customer_profile"</span>, <span class="str">"run_lp_optimizer"</span>)\ngraph.<span class="fn">add_edge</span>(<span class="str">"run_lp_optimizer"</span>, <span class="str">"run_monte_carlo"</span>)',
    reads: ['customer_profile'],
    writes: ['contribution_allocation', 'projected_wealth', 'optimization_diagnostics'],
    stateAfter: ['customer_profile', 'contribution_allocation', 'projected_wealth', 'optimization_diagnostics'],
  },
  monte_carlo: {
    name: 'run_monte_carlo',
    file: 'src/lang_graph_state/nodes/monte_carlo.py',
    badge: 'Stand-in Tool', badgeClass: 'badge-data',
    lgType: 'Plain function node — triggers the fan-out',
    desc: 'Stand-in simulation node. Its graph role is more important than its internals: it is the last sequential node before the fan-out. Once it returns, LangGraph sees three outgoing edges and schedules run_standard_analysis, run_accumulation_agent, and run_withdrawal_agent to execute concurrently. The parallelism comes entirely from the graph wiring — not from anything inside this node.',
    wiring: '<span class="cm"># main.py — fan-out: three edges from one node</span>\n<span class="cm"># LangGraph runs all three branches simultaneously</span>\ngraph.<span class="fn">add_edge</span>(<span class="str">"run_monte_carlo"</span>, <span class="str">"run_standard_analysis"</span>)\ngraph.<span class="fn">add_edge</span>(<span class="str">"run_monte_carlo"</span>, <span class="str">"run_accumulation_agent"</span>)\ngraph.<span class="fn">add_edge</span>(<span class="str">"run_monte_carlo"</span>, <span class="str">"run_withdrawal_agent"</span>)',
    reads: ['customer_profile', 'contribution_allocation'],
    writes: ['wealth_distribution', 'confidence_score', 'confidence_band'],
    stateAfter: ['customer_profile', 'contribution_allocation', 'projected_wealth', 'optimization_diagnostics', 'wealth_distribution', 'confidence_score', 'confidence_band'],
  },
  std_analysis: {
    name: 'run_standard_analysis',
    file: 'src/lang_graph_state/nodes/standard_analysis.py',
    badge: 'LLM Call', badgeClass: 'badge-llm',
    lgType: 'LLM completion node — parallel branch 1 of 3',
    desc: 'A single LLM call with no tools and no loop — the simplest way to add AI to a LangGraph node. Runs concurrently with run_accumulation_agent and run_withdrawal_agent because all three share run_monte_carlo as their only incoming edge. LangGraph dispatches them in parallel; no extra threading code is needed. Returns one PlanAnalysisSection to state.',
    wiring: '<span class="cm"># nodes/standard_analysis.py — builder pattern</span>\n<span class="kw">def</span> <span class="fn">build_standard_analysis_node</span>(service):\n    <span class="kw">async def</span> <span class="fn">run_standard_analysis</span>(state):\n        request = <span class="fn">PlanExplanationRequest</span>(customer_profile=state.customer_profile, ...)\n        <span class="kw">return</span> {<span class="str">"analysis_sections"</span>: [<span class="fn">PlanAnalysisSection</span>(kind=<span class="str">"standard"</span>, content=<span class="kw">await</span> service.<span class="fn">astandard_analysis</span>(request))]}\n    <span class="kw">return</span> run_standard_analysis\n\n<span class="cm"># main.py</span>\ngraph.<span class="fn">add_node</span>(<span class="str">"run_standard_analysis"</span>, <span class="fn">build_standard_analysis_node</span>(svc))',
    reads: ['customer_profile', 'contribution_allocation', 'projected_wealth', 'confidence_score', 'confidence_band'],
    writes: ['analysis_sections[kind=standard]'],
    stateAfter: ['customer_profile', 'contribution_allocation', 'projected_wealth', 'optimization_diagnostics', 'wealth_distribution', 'confidence_score', 'confidence_band', 'analysis_sections'],
  },
  accum_agent: {
    name: 'run_accumulation_agent',
    file: 'src/lang_graph_state/nodes/analysis_agents.py',
    badge: 'Probe + LLM', badgeClass: 'badge-agent',
    lgType: 'Gateway-backed analysis node — LP probes, parallel branch 2 of 3',
    desc: 'Runs deterministic LP sensitivity probes from the current state, then sends the assembled accumulation prompt through ExplanationService. The node returns one PlanAnalysisSection and runs concurrently with the other two analysis nodes — LangGraph does not wait for it before starting the others.',
    wiring: '<span class="cm"># nodes/analysis_agents.py — probe + gateway pattern</span>\n<span class="kw">def</span> <span class="fn">_build_analysis_node</span>(*, service_call, build_probes, analysis_kind):\n    <span class="kw">async def</span> <span class="fn">run_analysis</span>(state):\n        request = <span class="fn">_request_from_state</span>(state)\n        probe_results = <span class="fn">build_probes</span>(state)\n        content = <span class="kw">await</span> <span class="fn">service_call</span>(request, probe_results)\n        <span class="kw">return</span> {<span class="str">"analysis_sections"</span>: [<span class="fn">PlanAnalysisSection</span>(kind=analysis_kind, content=content)]}\n    <span class="kw">return</span> run_analysis',
    reads: ['customer_profile', 'contribution_allocation', 'projected_wealth', 'optimization_diagnostics'],
    writes: ['analysis_sections[kind=accumulation]'],
    stateAfter: ['customer_profile', 'contribution_allocation', 'projected_wealth', 'optimization_diagnostics', 'wealth_distribution', 'confidence_score', 'confidence_band', 'analysis_sections'],
  },
  with_agent: {
    name: 'run_withdrawal_agent',
    file: 'src/lang_graph_state/nodes/analysis_agents.py',
    badge: 'Probe + LLM', badgeClass: 'badge-agent',
    lgType: 'Gateway-backed analysis node — MC probes, parallel branch 3 of 3',
    desc: 'Same structure as run_accumulation_agent, but it runs Monte Carlo sensitivity probes instead of LP probes. Text generation still goes through ExplanationService and GatewayClient. Runs concurrently in the third parallel branch.',
    wiring: '<span class="cm"># main.py — both analysis nodes share the graph service</span>\ngraph.<span class="fn">add_node</span>(<span class="str">"run_accumulation_agent"</span>, <span class="fn">build_accumulation_node</span>(svc))\ngraph.<span class="fn">add_node</span>(<span class="str">"run_withdrawal_agent"</span>,  <span class="fn">build_withdrawal_node</span>(svc))\n\n<span class="cm"># fan-in: LangGraph waits for all three before firing synthesize</span>\ngraph.<span class="fn">add_edge</span>(<span class="str">"run_standard_analysis"</span>,   <span class="str">"synthesize_explanation"</span>)\ngraph.<span class="fn">add_edge</span>(<span class="str">"run_accumulation_agent"</span>, <span class="str">"synthesize_explanation"</span>)\ngraph.<span class="fn">add_edge</span>(<span class="str">"run_withdrawal_agent"</span>,  <span class="str">"synthesize_explanation"</span>)',
    reads: ['customer_profile', 'contribution_allocation', 'wealth_distribution', 'confidence_score', 'confidence_band'],
    writes: ['analysis_sections[kind=withdrawal]'],
    stateAfter: ['customer_profile', 'contribution_allocation', 'projected_wealth', 'optimization_diagnostics', 'wealth_distribution', 'confidence_score', 'confidence_band', 'analysis_sections'],
  },
  synthesize: {
    name: 'synthesize_explanation',
    file: 'src/lang_graph_state/nodes/synthesize_explanation.py',
    badge: 'LLM Call', badgeClass: 'badge-synth',
    lgType: 'LLM completion node — fan-in point, 4th LLM call',
    desc: 'The fan-in node. LangGraph holds this node until all three incoming edges have delivered their state updates — it fires only once all three PlanAnalysisSection values are merged. Then it makes a single LLM call to weave them into a coherent client-facing explanation. No tools; pure synthesis. The confidence_band field shapes tone (high / medium / low).',
    wiring: '<span class="cm"># main.py — fan-in: three edges converge here</span>\n<span class="cm"># LangGraph waits for all three before dispatching this node</span>\ngraph.<span class="fn">add_edge</span>(<span class="str">"run_standard_analysis"</span>,   <span class="str">"synthesize_explanation"</span>)\ngraph.<span class="fn">add_edge</span>(<span class="str">"run_accumulation_agent"</span>, <span class="str">"synthesize_explanation"</span>)\ngraph.<span class="fn">add_edge</span>(<span class="str">"run_withdrawal_agent"</span>,  <span class="str">"synthesize_explanation"</span>)\ngraph.<span class="fn">add_edge</span>(<span class="str">"synthesize_explanation"</span>, <span class="str">"format_output"</span>)',
    reads: ['analysis_sections', 'confidence_band'],
    writes: ['explanation'],
    stateAfter: ['customer_profile', 'contribution_allocation', 'projected_wealth', 'optimization_diagnostics', 'wealth_distribution', 'confidence_score', 'confidence_band', 'analysis_sections', 'explanation'],
  },
  format_output: {
    name: 'format_output',
    file: 'src/lang_graph_state/nodes/format_output.py',
    badge: 'Plain Function', badgeClass: 'badge-output',
    lgType: 'Plain function node — terminal, no LLM',
    desc: 'Pure deterministic assembly — no LLM, no tools. Packs all accumulated state fields into a RetirementPlanResult struct and writes it to state. After this node completes LangGraph advances to END. The simplest exit node pattern: read everything, return one key.',
    wiring: '<span class="cm"># main.py — terminal sequence</span>\ngraph.<span class="fn">add_node</span>(<span class="str">"format_output"</span>, format_output)\ngraph.<span class="fn">add_edge</span>(<span class="str">"synthesize_explanation"</span>, <span class="str">"format_output"</span>)\ngraph.<span class="fn">add_edge</span>(<span class="str">"format_output"</span>, END)',
    reads: ['All accumulated state fields'],
    writes: ['result'],
    stateAfter: ['customer_profile', 'contribution_allocation', 'projected_wealth', 'optimization_diagnostics', 'wealth_distribution', 'confidence_score', 'confidence_band', 'analysis_sections', 'explanation', 'result'],
  },
};

// ── All state fields (ordered) ────────────────────────────────────

const ALL_STATE_FIELDS = [
  { name: 'customer_profile',         src: 'load_customer_profile' },
  { name: 'contribution_allocation',  src: 'run_lp_optimizer' },
  { name: 'projected_wealth',         src: 'run_lp_optimizer' },
  { name: 'optimization_diagnostics', src: 'run_lp_optimizer' },
  { name: 'wealth_distribution',      src: 'run_monte_carlo' },
  { name: 'confidence_score',         src: 'run_monte_carlo' },
  { name: 'confidence_band',          src: 'run_monte_carlo' },
  { name: 'analysis_sections',        src: 'parallel_analysis_branches' },
  { name: 'explanation',              src: 'synthesize_explanation' },
  { name: 'result',                   src: 'format_output' },
];

// ── Geometry helpers ──────────────────────────────────────────────

function nodeById(id) { return NODES.find(n => n.id === id); }

function nodeRect(n) {
  const w = n.type === 'terminal' ? 90 : W;
  const h = n.type === 'terminal' ? 28 : H;
  return { x: n.x - w/2, y: n.y - h/2, w, h };
}

function edgePts(from, to) {
  const fn = nodeById(from), tn = nodeById(to);
  const fr = nodeRect(fn), tr = nodeRect(tn);
  const x0 = fn.x, y0 = fr.y + fr.h;  // bottom center of from
  const x1 = tn.x, y1 = tr.y;          // top center of to

  if (Math.abs(x0 - x1) < 2) {
    // straight vertical
    return `M ${x0} ${y0} L ${x1} ${y1}`;
  }
  const my = (y0 + y1) / 2;
  return `M ${x0} ${y0} C ${x0} ${my} ${x1} ${my} ${x1} ${y1}`;
}

// ── Render SVG ────────────────────────────────────────────────────

function svgEl(tag, attrs = {}, parent) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (parent) parent.appendChild(el);
  return el;
}

function renderGraph() {
  const svg = document.getElementById('graph');
  svg.innerHTML = '';

  // Defs
  const defs = svgEl('defs', {}, svg);
  const marker = svgEl('marker', {
    id: 'arr', markerWidth: 8, markerHeight: 8,
    refX: 6, refY: 3, orient: 'auto',
  }, defs);
  svgEl('path', { d: 'M0,0 L0,6 L8,3 z', fill: '#3A4060' }, marker);

  const markerLit = svgEl('marker', {
    id: 'arr-lit', markerWidth: 8, markerHeight: 8,
    refX: 6, refY: 3, orient: 'auto',
  }, defs);
  svgEl('path', { d: 'M0,0 L0,6 L8,3 z', fill: '#3B82F6' }, markerLit);

  const markerPar = svgEl('marker', {
    id: 'arr-par', markerWidth: 8, markerHeight: 8,
    refX: 6, refY: 3, orient: 'auto',
  }, defs);
  svgEl('path', { d: 'M0,0 L0,6 L8,3 z', fill: '#8B5CF6' }, markerPar);

  // Parallel zone background
  svgEl('rect', {
    class: 'parallel-zone',
    x: 12, y: 370, width: 516, height: 215,
  }, svg);
  svgEl('text', {
    class: 'parallel-label',
    x: 270, y: 388,
  }, svg).textContent = 'Parallel Execution Zone';

  // Edges (render behind nodes)
  const edgeGroup = svgEl('g', { id: 'edges' }, svg);
  for (const e of EDGES) {
    const path = svgEl('path', {
      class: `edge ${e.class}`,
      id: `edge-${e.from}-${e.to}`,
      d: edgePts(e.from, e.to),
      'marker-end': 'url(#arr)',
    }, edgeGroup);
  }

  // Nodes
  const nodeGroup = svgEl('g', { id: 'nodes' }, svg);
  for (const n of NODES) {
    const { x: rx, y: ry, w, h } = nodeRect(n);
    const style = NODE_STYLE[n.type];

    const g = svgEl('g', { class: 'node-group', id: `node-${n.id}` }, nodeGroup);

    svgEl('rect', {
      class: 'node-bg',
      x: rx, y: ry, width: w, height: h,
      rx: n.type === 'terminal' ? 14 : R,
      fill: style.fill,
      stroke: style.stroke,
      'stroke-width': 1.5,
    }, g);

    // Label positioning
    if (style.label2) {
      svgEl('text', { class: 'node-label', x: n.x, y: n.y - 6 }, g).textContent = n.label;
      svgEl('text', { class: 'node-sublabel', x: n.x, y: n.y + 10 }, g).textContent = style.label2;
    } else {
      svgEl('text', { class: 'node-label', x: n.x, y: n.y }, g).textContent = n.label;
    }

    if (DETAILS[n.id]) {
      g.addEventListener('click', () => selectNode(n.id));
    }
  }
}

// ── Selection & detail panel ──────────────────────────────────────

let selectedId = null;

function selectNode(id) {
  // Deselect previous
  if (selectedId) {
    const prev = document.getElementById(`node-${selectedId}`);
    if (prev) prev.classList.remove('selected');
  }
  selectedId = id;
  const el = document.getElementById(`node-${id}`);
  if (el) el.classList.add('selected');

  const d = DETAILS[id];
  if (!d) return;

  const card = document.getElementById('detailCard');
  const isAgent = d.badgeClass === 'badge-agent';
  const writeClass = isAgent ? 'write violet' : 'write';

  card.innerHTML = `
    <div class="card-title">Node Details</div>
    <div class="nd-header">
      <div class="nd-name">${d.name}</div>
      <span class="nd-badge ${d.badgeClass}">${d.badge}</span>
    </div>
    <div class="nd-file">${d.file}</div>
    ${d.lgType ? `<div class="nd-lgtype">LangGraph type: <span>${d.lgType}</span></div>` : ''}
    <div class="nd-desc">${d.desc}</div>
    ${d.wiring ? `
    <div class="io-section">
      <div class="io-label">Graph Wiring</div>
      <pre class="wiring">${d.wiring}</pre>
    </div>` : ''}
    <div class="io-section">
      <div class="io-label">Reads from State</div>
      <div class="tags">${d.reads.map(f => `<span class="tag">${f}</span>`).join('')}</div>
    </div>
    <div class="io-section">
      <div class="io-label">Writes to State</div>
      <div class="tags">${d.writes.map(f => `<span class="tag ${writeClass}">${f}</span>`).join('')}</div>
    </div>
  `;

  // Update state inspector to show what's available after this node
  updateStateInspector(d.stateAfter || []);
}

function updateStateInspector(liveFields) {
  const el = document.getElementById('stateInspector');
  el.innerHTML = ALL_STATE_FIELDS.map(f => {
    const live = liveFields.includes(f.name);
    return `
      <div class="state-row ${live ? 'live' : ''}">
        <div class="state-dot ${live ? 'live' : ''}"></div>
        <span class="state-fname ${live ? 'live' : ''}">${f.name}</span>
        <span class="state-src">${f.src}</span>
      </div>
    `;
  }).join('');
}

// ── Animation ─────────────────────────────────────────────────────

const ANIMATION_STEPS = [
  { nodes: ['load_profile'],                          edges: [['start','load_profile']],                                                 parallel: false },
  { nodes: ['lp_optimizer'],                          edges: [['load_profile','lp_optimizer']],                                          parallel: false },
  { nodes: ['monte_carlo'],                           edges: [['lp_optimizer','monte_carlo']],                                           parallel: false },
  { nodes: ['std_analysis','accum_agent','with_agent'], edges: [['monte_carlo','std_analysis'],['monte_carlo','accum_agent'],['monte_carlo','with_agent']], parallel: true  },
  { nodes: ['synthesize'],                            edges: [['std_analysis','synthesize'],['accum_agent','synthesize'],['with_agent','synthesize']], parallel: true },
  { nodes: ['format_output'],                         edges: [['synthesize','format_output']],                                           parallel: false },
  { nodes: ['end'],                                   edges: [['format_output','end']],                                                  parallel: false },
];

let animTimer = null;
let animStep = 0;
let litEdges = new Set();
let litNodes = new Set();

function clearLit() {
  for (const eid of litEdges) {
    const el = document.getElementById(eid);
    if (el) { el.classList.remove('lit','litpar'); el.setAttribute('marker-end','url(#arr)'); }
  }
  for (const nid of litNodes) {
    const el = document.getElementById(nid);
    if (el) el.classList.remove('lit');
  }
  litEdges.clear();
  litNodes.clear();
}

function runStep(stepIdx) {
  if (stepIdx >= ANIMATION_STEPS.length) {
    document.getElementById('btnAnimate').disabled = false;
    document.getElementById('btnAnimate').textContent = '▶ Animate Flow';
    animStep = 0;
    return;
  }

  const step = ANIMATION_STEPS[stepIdx];
  const cls = step.parallel ? 'litpar' : 'lit';
  const markerRef = step.parallel ? 'url(#arr-par)' : 'url(#arr-lit)';

  for (const [from, to] of step.edges) {
    const eid = `edge-${from}-${to}`;
    const el = document.getElementById(eid);
    if (el) { el.classList.add(cls); el.setAttribute('marker-end', markerRef); litEdges.add(eid); }
  }

  setTimeout(() => {
    for (const nid of step.nodes) {
      const el = document.getElementById(`node-${nid}`);
      if (el) { el.classList.add('lit'); litNodes.add(`node-${nid}`); }
      if (DETAILS[nid]) selectNode(nid);
    }
    animTimer = setTimeout(() => runStep(stepIdx + 1), step.parallel ? 1600 : 900);
  }, 200);
}

document.getElementById('btnAnimate').addEventListener('click', () => {
  clearTimeout(animTimer);
  clearLit();
  animStep = 0;
  document.getElementById('btnAnimate').disabled = true;
  document.getElementById('btnAnimate').textContent = '⏳ Running…';
  runStep(0);
});

document.getElementById('btnReset').addEventListener('click', () => {
  clearTimeout(animTimer);
  clearLit();
  animStep = 0;
  document.getElementById('btnAnimate').disabled = false;
  document.getElementById('btnAnimate').textContent = '▶ Animate Flow';

  if (selectedId) {
    const prev = document.getElementById(`node-${selectedId}`);
    if (prev) prev.classList.remove('selected');
    selectedId = null;
  }

  document.getElementById('detailCard').innerHTML = `
    <div class="card-title">Node Details</div>
    <div class="empty-hint">Click any node in the graph<br>to see what it does, what it reads,<br>and what it writes to state.</div>
  `;
  document.getElementById('stateInspector').innerHTML = '';
});

// ── Init ──────────────────────────────────────────────────────────

renderGraph();

// Render initial (empty) state inspector
updateStateInspector([]);
document.getElementById('stateInspector').innerHTML = ALL_STATE_FIELDS.map(f => `
  <div class="state-row">
    <div class="state-dot"></div>
    <span class="state-fname">${f.name}</span>
    <span class="state-src">${f.src}</span>
  </div>
`).join('');
</script>
